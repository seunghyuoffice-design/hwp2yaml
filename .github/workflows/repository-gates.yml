name: Repository gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-and-python-baseline:
    name: repository-and-python-baseline (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify repository and reachable history
        run: python -B qa/verify_repository.py
      - name: Run fail-closed negative canaries
        run: python -B -m unittest discover -s qa -p "test_*.py"
      - name: Install public baseline and pinned audit tools
        run: python -m pip install --disable-pip-version-check . "pytest==9.1.1" "ruff==0.16.5"
      - name: Run public Python baseline tests
        run: python -B -m pytest -q -p no:cacheprovider tests
      - name: Verify acknowledged Ruff regression floor
        run: python -B qa/verify_ruff_baseline.py
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Verify patch and worktree cleanliness
        shell: bash
        run: |
          git diff --check 56231e2e4e26e3aff3dcff6ef82f5789aaa4a9d8 --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Verify Git object graph
        run: git fsck --full --strict
